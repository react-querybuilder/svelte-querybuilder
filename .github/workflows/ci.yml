name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun fmt:check

      - name: Build
        run: bun run build

      - name: Check
        run: bun run check

      - name: Check package exports
        run: bun run check:exports

      - name: Lint
        run: bun lint

      - name: Test
        run: bun run test:coverage

      - name: Conformance
        run: bun run conformance

      - name: SSR smoke test
        run: bun run test:ssr
